<style>
  :root {
    --bg: #000000;
    --card: #141414;
    --card-border: #232323;
    --text: #f2f2f2;
    --accent: #b74b4b;
    --accent-light: #d16b6b;
  }

  .skills-section {
    background: var(--bg);
    padding: 60px 40px;
    font-family: 'Segoe UI', Arial, sans-serif;
    text-align: center;
  }

  .skills-section h2 {
    color: var(--accent);
    font-size: 34px;
    margin-bottom: 45px;
  }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    max-width: 1300px;
    margin: 0 auto;
  }

  @media (max-width: 1000px) {
    .skills-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .skills-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .skill-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .skill-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
  }

  .skill-card svg {
    width: 56px;
    height: 56px;
    fill: var(--accent);
  }

  .skill-card span {
    color: var(--text);
    font-weight: 700;
    font-size: 17px;
  }
</style>
